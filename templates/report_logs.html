<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Logs</title>

    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons (REQUIRED for sidebar icons) -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
.area-meta{color:var(--muted-text);font-size:0.85rem;}

:root{--bg-color:#020617;--card-bg:#0f172a;--border-color:#1e293b;--text-color:#ffffff;--muted-text:#94a3b8;--input-bg:#0b1224;--input-border:#1e293b;--primary:#0ea5e9;--primary-hover:#0284c7;}

body.light-theme{--bg-color:#f1f5f9;--card-bg:#ffffff;--border-color:#e2e8f0;--text-color:#0f172a;--muted-text:#64748b;--input-bg:#f8fafc;--input-border:#cbd5e1;--primary:#0284c7;--primary-hover:#0369a1;}

body{margin:0;min-height:100vh;background:var(--bg-color);color:var(--text-color);font-family:Arial,sans-serif;transition:0.25s ease;}

.card,.modal-content,.form-control{background:var(--card-bg)!important;color:var(--text-color)!important;border-color:var(--border-color)!important;}

.sidebar{width:260px;height:100vh;position:fixed;top:0;left:0;background:var(--card-bg);border-right:1px solid var(--border-color);padding:25px 18px;}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:35px;}

.brand i{font-size:2rem;color:var(--primary);}

.brand h4{margin:0;font-weight:bold;}

.sidebar a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--muted-text);padding:12px 15px;border-radius:12px;margin-bottom:10px;transition:0.2s;}

.sidebar a:hover,.sidebar a.active{background:rgba(14,165,233,0.15);color:var(--text-color);}

.main-content{margin-left:260px;padding:30px;}

.dashboard-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;padding:25px;box-shadow:0 0 20px rgba(0,0,0,0.25);}

.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;}

.dashboard-header h2{font-weight:bold;margin:0;}

.dashboard-header p{margin:0;color:var(--muted-text);}

.btn-primary-custom{background:var(--primary);border:none;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;}

.btn-primary-custom:hover{background:var(--primary-hover);}

.btn-outline-custom{border:1px solid var(--border-color);background:transparent;color:var(--text-color);padding:10px 18px;border-radius:10px;}

.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}

.area-card{background:var(--card-bg)!important;border:1px solid var(--border-color)!important;border-radius:14px;color:var(--text-color);}

#report_photo_container{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px;}

.report-photo-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;overflow:hidden;transition:0.2s ease;}

.report-photo-card:hover{transform:translateY(-3px);}

.report-photo-card img{width:100%;height:200px;object-fit:cover;display:block;}

.report-meta{padding:10px 12px;font-size:0.82rem;color:var(--muted-text);display:flex;flex-direction:column;gap:4px;}

.report-meta .date-time{font-weight:600;color:var(--text-color);font-size:0.85rem;}

.report-meta .meta-label{font-size:0.75rem;opacity:0.8;}

.modal-content{background:var(--card-bg);border:1px solid var(--border-color);color:var(--text-color);border-radius:18px;}

.modal-header{border-bottom:1px solid var(--border-color);}

.modal-body input[type="date"]{width:auto;min-width:180px;max-width:220px;display:inline-block;padding:8px 10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;color:var(--text-color);}

body.light-theme .modal-body input[type="date"]{color-scheme:light;}

.modal-body input[type="date"]:focus{border-color:var(--primary);box-shadow:none;}

@media(max-width:768px){
.sidebar{width:100%;height:auto;position:relative;display:flex;flex-wrap:wrap;justify-content:center;}
.main-content{margin-left:0;}
.brand{width:100%;justify-content:center;}
.dashboard-header{flex-direction:column;align-items:flex-start;gap:15px;}
}
</style>
</head>

<body>

<!-- SIDEBAR (FULL PRESIDENT MATCH) -->
<div class="sidebar">

    <div class="brand">
        <i class="bi bi-shield-check"></i>
        <h4>Officer</h4>
    </div>

    <a href="officer_dashboard.html">
        <i class="bi bi-grid-fill"></i>
        Dashboard
    </a>

    <a href="report_logs.html" class="active">
        <i class="bi bi-clock-history"></i>
        Reports
    </a>

    <a href="#">
        <i class="bi bi-bell-fill"></i>
        Notifications
    </a>


    <a href="#" id="btn_sign_out">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </a>

</div>

<!-- MAIN -->
<div class="main-content">

    <div class="dashboard-card">

        <div class="dashboard-header">

            <div>
                <h2>Report Logs</h2>
                <p>View assigned cleaning reports and photo records</p>
            </div>

            <!-- THEME TOGGLE (RESTORED) -->
            <button class="btn-outline-custom" id="themeToggle">
                <i class="bi bi-moon-fill"></i>
                
            </button>

        </div>

        <!-- JS TARGET (UNCHANGED) -->
        <div id="area_assignments" class="report-grid"></div>

    </div>

</div>

<!-- DETAILS MODAL -->
<div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Cleaning Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

                <div class="modal-body">
                    <input type="date" id="filter_by_date">
                    <button type="button" class="btn btn-primary" id="filter_date_btn">Select</button>
                    <p> Photos </p>
                    <div id="report_photo_container"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="btn_accept_report">
                        Accept
                    </button>

                    <button type="button" class="btn btn-danger" id='btn_decline_report' data-bs-dismiss="modal">
                        Decline
                    </button>
                    
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>

        </div>
    </div>
</div>

<!-- LOADING MODAL -->
<div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-body text-center p-5">
                <div class="spinner-border text-primary"></div>
                <h5>Processing...</h5>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="../src/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="../services/auth/sign_out.js"></script>
<script type="module" src="../services/section_dropdown.js"></script>

<script type="module">
    import { requireAuth } from "../services/auth/session.js";
    import { renderAreaAssignments } from "../services/reports/render_area_assignments.js";

    requireAuth();
    renderAreaAssignments();
</script>

<!-- THEME SWITCH (RESTORED EXACT BEHAVIOR) -->
<script>
const themeToggle = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light-theme");
}

themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("light-theme");

    if (document.body.classList.contains("light-theme")) {
        localStorage.setItem("theme", "light");
    } else {
        localStorage.setItem("theme", "dark");
    }
});
</script>

</body>
</html>
