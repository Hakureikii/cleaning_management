<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Officer Dashboard</title>

<link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root { --bg-color:#020617; --card-bg:#0f172a; --border-color:#1e293b; --text-color:#ffffff; --muted-text:#94a3b8; --primary:#0ea5e9; --primary-hover:#0284c7; }

body.light-theme { --bg-color:#f1f5f9; --card-bg:#ffffff; --border-color:#e2e8f0; --text-color:#0f172a; --muted-text:#64748b; --primary:#0284c7; --primary-hover:#0369a1; }

body { margin:0; min-height:100vh; background:var(--bg-color); color:var(--text-color); font-family:Arial,sans-serif; transition:0.25s ease; }

.card, .modal-content, .form-control { background:var(--card-bg)!important; color:var(--text-color)!important; border-color:var(--border-color)!important; }

.sidebar { width:260px; height:100vh; position:fixed; top:0; left:0; background:var(--card-bg); border-right:1px solid var(--border-color); padding:25px 18px; }

.brand { display:flex; align-items:center; gap:12px; margin-bottom:35px; }

.brand i { font-size:2rem; color:var(--primary); }

.brand h4 { margin:0; font-weight:bold; }

.sidebar a { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--muted-text); padding:12px 15px; border-radius:12px; margin-bottom:10px; }

.sidebar a:hover, .sidebar a.active { background:rgba(14,165,233,0.15); color:var(--text-color); }

.main-content { margin-left:260px; padding:30px; }

.dashboard-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:18px; padding:25px; box-shadow:0 0 20px rgba(0,0,0,0.25); }

.dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }

.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }

.stat-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:14px; padding:18px; }

.stat-title { color:var(--muted-text); font-size:0.9rem; }

.stat-value { font-size:1.6rem; font-weight:bold; }

.btn-outline-custom { border:1px solid var(--border-color); background:transparent; color:var(--text-color); padding:10px 18px; border-radius:10px; }

@media(max-width:768px){
.sidebar{ position:relative; width:100%; height:auto; display:flex; flex-wrap:wrap; justify-content:center; }
.main-content{ margin-left:0; }
.dashboard-header{ flex-direction:column; align-items:flex-start; gap:12px; }
}
</style>
</head>

<body>

<!-- SIDEBAR (MATCHED) -->
<div class="sidebar">

    <div class="brand">
        <i class="bi bi-shield-check"></i>
        <h4>Officer</h4>
    </div>

    <a class="active" href="officer_dashboard.html">
        <i class="bi bi-grid-fill"></i> Dashboard
    </a>

    <a href="report_logs.html">
        <i class="bi bi-clock-history"></i> Reports
    </a>

    <a href="#">
        <i class="bi bi-bell-fill"></i> Notifications
    </a>

    <a href="#" id="btn_sign_out">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>

</div>

<!-- MAIN -->
<div class="main-content">

    <div class="dashboard-card">

        <div class="dashboard-header">

            <div>
                <h2>Officer Dashboard</h2>
                <p style="color: var(--muted-text); margin:0;">
                    Overview of reports and activity
                </p>
            </div>

            <!-- MATCHED BUTTON -->
            <button class="btn-outline-custom" id="themeToggle">
                <i class="bi bi-moon-fill"></i>
                
            </button>

        </div>

        <!-- GRID -->
        <div class="grid">

            <div class="stat-card">
                <div class="stat-title">Today's Reports</div>
                <div class="stat-value">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Pending Tasks</div>
                <div class="stat-value">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Areas Assigned</div>
                <div class="stat-value">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Notifications</div>
                <div class="stat-value">0</div>
            </div>

        </div>

    </div>

</div>

<!-- SCRIPTS -->
<script src="../src/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="../services/auth/sign_out.js"></script>

<script type="module">
import { requireAuth } from "../services/auth/session.js";
requireAuth();
</script>

<!-- THEME TOGGLE (UNCHANGED BEHAVIOR) -->
<script>
const themeToggle = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light-theme");
}

themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("light-theme");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("light-theme") ? "light" : "dark"
    );
});
</script>

</body>
</html>
