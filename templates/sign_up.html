<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #020617;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .signup-card {
            width: 100%;
            max-width: 850px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header i {
            font-size: 2.8rem;
            color: #38bdf8;
        }

        .header h2 {
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.8rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .form-control,
        .form-select {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 10px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background: #1e293b;
            color: white;
            border-color: #0ea5e9;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .input-group-text {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
        }

        .btn-signup {
            background: #0ea5e9;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-signup:hover {
            background: #0284c7;
        }

        .signin-link {
            text-align: center;
            margin-top: 18px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .signin-link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        @media(max-width: 768px) {

            .signup-card {
                padding: 25px;
            }

        }
    </style>

</head>

<body>

    <div class="signup-card">

        <!-- HEADER -->

        <div class="header">

            <i class="bi bi-person-plus-fill"></i>

            <h2>Create Account</h2>

            <p>
                Register to access the Cleaning Management System
            </p>

        </div>

        <form>

            <!-- NAME GROUP -->

            <div class="row g-3 mb-3">

                <div class="col-md-4">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>

                        <input type="text" class="form-control" placeholder="First Name" id="fname" required>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text" class="form-control" placeholder="Middle Name" id="mname" required>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>

                        <input type="text" class="form-control" placeholder="Last Name" id="lname" required>

                    </div>

                </div>

            </div>

            <!-- SECOND GROUP -->

            <div class="row g-3 mb-3">

                <div class="col-md-6">

                    <div class="input-group mb-4">

                        <span class="input-group-text">
                            <i class="bi bi-people-fill"></i>
                        </span>

                        <select class="form-select" id="section_dropdown">

                        </select>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-badge-fill"></i>
                        </span>

                        <select class="form-select" id="role">

                            <option selected disabled>
                                Select Role
                            </option>

                            <option value="president">
                                President
                            </option>

                            <option value="officer">
                                Officer
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- THIRD GROUP -->

            <div class="row g-3 mb-4">

                <div class="col-md-6">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope-fill"></i>
                        </span>

                        <input type="email" class="form-control" placeholder="Email Address" id="email" required>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input type="password" class="form-control" placeholder="Password" id="password" required>

                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <button type="button" id="btn_sign_up" class="btn btn-signup w-100">

                <i class="bi bi-check-circle-fill"></i>
                Create Account

            </button>

        </form>

        <div class="signin-link">

            Already have an account?

            <a href="sign_in.html">
                Sign in here
            </a>

        </div>

    </div>

</body>

</html>

<script type="module" src="../services/auth/sign_up.js"></script>
<script type="module">
    import { sections } from '../services/section_dropdown.js'
    sections();
</script>
