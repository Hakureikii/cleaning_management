<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign Up </title>
    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>
    <input type="text" placeholder="First Name" id="fname" required>
    <input type="text" placeholder="Middle Name" id="mname" required>
    <input type="text" placeholder="Last Name" id="lname" required>
    <input type="text" placeholder="Section" id="section" required>
    <input type="email" placeholder="Email" id="email" required>
    <input type="password" placeholder="Password" id="password" required>
    <select name="" id="role">
        <option value="president"> President </option>
        <option value="officer"> Officer </option>
    </select>
    <button id="btn_sign_up"> Sign Up</button>
    <a href="sign_in.html"> Already have an account? Sign in here</a>

</body>

</html>

<script type="module" src="../services/auth/sign_up.js"></script>
