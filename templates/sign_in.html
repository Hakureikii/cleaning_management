<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            margin: 0;
            min-height: 100vh;
            background: #020617;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .signin-card{
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 20px rgba(0,0,0,0.35);
        }

        .header{
            text-align: center;
            margin-bottom: 30px;
        }

        .header i{
            font-size: 3rem;
            color: #38bdf8;
        }

        .header h2{
            margin-top: 10px;
            font-weight: bold;
        }

        .header p{
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .form-control,
        .form-select{
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 11px 12px;
        }

        .form-control:focus,
        .form-select:focus{
            background: #1e293b;
            color: white;
            border-color: #0ea5e9;
            box-shadow: none;
        }

        .form-control::placeholder{
            color: #94a3b8;
        }

        .input-group-text{
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
        }

        .btn-signin{
            background: #0ea5e9;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-signin:hover{
            background: #0284c7;
        }

        .signup-link{
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .signup-link a{
            color: #38bdf8;
            text-decoration: none;
        }

        .signup-link a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="signin-card">

        <!-- HEADER -->

        <div class="header">

            <i class="bi bi-shield-lock-fill"></i>

            <h2>Welcome Back</h2>

            <p>
                Sign in to continue to the Cleaning Management System
            </p>

        </div>

        <!-- FORM -->

        <form>

            <!-- EMAIL -->

            <div class="input-group mb-3">

                <span class="input-group-text">
                    <i class="bi bi-envelope-fill"></i>
                </span>

                <input type="email"
                class="form-control"
                placeholder="Email Address"
                id="email"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group mb-3">

                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password"
                class="form-control"
                placeholder="Password"
                id="password"
                required>

            </div>

            <!-- ROLE -->

            <div class="input-group mb-4">

                <span class="input-group-text">
                    <i class="bi bi-person-badge-fill"></i>
                </span>

                <select class="form-select" id="role">

                    <option selected disabled>
                        Select Role
                    </option>

                    <option value="president">
                        President
                    </option>

                    <option value="officer">
                        Officer
                    </option>

                </select>

            </div>

            <!-- BUTTON -->

            <button
            type="submit"
            id="btn_sign_in"
            class="btn btn-signin w-100">

                <i class="bi bi-box-arrow-in-right"></i>
                Sign In

            </button>

        </form>

        <!-- LINK -->

        <div class="signup-link">

            Don't have an account?

            <a href="sign_up.html">
                Register here
            </a>

        </div>

    </div>

</body>

</html>

<script type="module" src="../services/auth/sign_in.js"></script>
