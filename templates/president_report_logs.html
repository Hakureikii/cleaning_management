<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Report Logs </title>
    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <a href="president_dashboard.html">Dashboard</a>
    <a href="president_report_logs.html"> Report Logs </a>
    <a href="#"> Duties </a>
    <a href="#"> Notifications </a>
    <a href="#"> Profile </a>
    <button id="btn_sign_out"> Logout </button>

    <!-- Floating button report -->
    <button type="button" id="btn_report" data-bs-toggle="modal" data-bs-target="#reportModal"> Send Report </button>

    <!-- Area Assignments list -->
    <div id="area_assignments">
    </div>

    <!-- Send Report Modal -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Send Reports</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="file" id="photoInput">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>

                    <button type="button" class="btn btn-success" id="btn_send_report">
                        Send Report
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Cleaning Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p> Photos </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow rounded-4">

                <div class="modal-body text-center p-5">

                    <!-- Spinner -->
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>

                    <h5 class="fw-bold">Processing...</h5>
                    <p class="text-muted mb-0">
                        Please wait this won't take long...
                    </p>

                </div>

            </div>

        </div>
    </div>

    <!-- Success Report Modal -->
    <div class="modal fade" id="successReportModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center border-0 shadow rounded-4 p-4">

                <div class="modal-body">

                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>

                    <h4 class="fw-bold mt-3">Success!</h4>
                    <p class="text-muted">Your report has been submitted.</p>

                    <button class="btn btn-success mt-2" data-bs-dismiss="modal">
                        OK
                    </button>

                </div>

            </div>
        </div>
    </div>


</body>

</html>

<script src="../src/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src='../services/reports/send_reports.js'></script>
<script type="module" src="../services/auth/sign_out.js"></script>

<script type="module">
    import { requireAuth } from "../services/auth/session.js";
    import { renderAreaAssignments } from "../services/reports/render_area_assignments.js";
    requireAuth();
    renderAreaAssignments();
</script>
