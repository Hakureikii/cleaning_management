<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Management System</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            margin: 0;
            height: 100vh;
            background: #0f172a;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        .split-screen{
            display: flex;
            height: 100vh;
        }

        /* LEFT */
        .left-side{
            flex: 1;
            background: linear-gradient(135deg, #111827, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .left-content{
            max-width: 420px;
        }

        .left-content h1{
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .left-content p{
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .system-icon{
            font-size: 3.5rem;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        /* RIGHT */
        .right-side{
            flex: 1;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box{
            width: 100%;
            max-width: 320px;
            padding: 30px;
            border-radius: 15px;
            background: #111827;
            border: 1px solid #1e293b;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .auth-box h2{
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .btn-custom{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-darkmode{
            background: #0ea5e9;
            border: none;
        }

        .btn-darkmode:hover{
            background: #0284c7;
        }

        .btn-outline-light{
            border-color: #334155;
        }

        .btn-outline-light:hover{
            background: #1e293b;
        }

        .divider{
            text-align: center;
            color: #64748b;
            margin: 15px 0;
            font-size: 0.85rem;
        }

        @media(max-width:768px){

            .split-screen{
                flex-direction: column;
            }

            .left-side{
                height: 45vh;
                text-align: center;
            }

            .right-side{
                height: 55vh;
            }

            .left-content h1{
                font-size: 1.8rem;
            }

        }

    </style>
</head>

<body>

    <div class="split-screen">

        <!-- LEFT SIDE -->
        <div class="left-side">

            <div class="left-content">

                <i class="bi bi-buildings-fill system-icon"></i>

                <h1>Cleaning Management System</h1>

                <p>
                    Organize cleaning schedules, manage staff,
                    and monitor operations with a modern centralized system.
                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="auth-box">

                <h2>
                    <i class="bi bi-shield-lock-fill"></i>
                    Welcome
                </h2>

                <a href="templates/sign_in.html"
                class="btn btn-darkmode btn-custom text-white mb-3">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign In

                </a>

                <div class="divider">
                    OR
                </div>

                <a href="templates/sign_up.html"
                class="btn btn-outline-light btn-custom">

                    <i class="bi bi-person-plus-fill"></i>
                    Create Account

                </a>

            </div>

        </div>

    </div>

</body>
</html>
